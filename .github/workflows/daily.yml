name: Scheduled pipelines

on:
  schedule:
    - cron: "0 5,8,11,14,17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hospital-job-watch-pipelines
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PROFILE_FACTUEL: ${{ secrets.PROFILE_FACTUEL }}
      PROFILE_MOTIVATIONNEL: ${{ secrets.PROFILE_MOTIVATIONNEL }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_TOKEN_ALERT: ${{ secrets.TELEGRAM_TOKEN_ALERT }}
      TELEGRAM_CHAT_ID_ALERT: ${{ secrets.TELEGRAM_CHAT_ID_ALERT }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Initialize database schema
        run: python -m scripts.init_db

      - name: Run AP-HP pipeline
        id: aphp
        continue-on-error: true
        run: python pipeline_aphp.py

      - name: Run HCL pipeline
        id: hcl
        continue-on-error: true
        run: python pipeline_hcl.py

      - name: Report pipeline failures
        if: always()
        env:
          APHP_OUTCOME: ${{ steps.aphp.outcome }}
          HCL_OUTCOME: ${{ steps.hcl.outcome }}
        run: |
          if [ "$APHP_OUTCOME" != "success" ] || [ "$HCL_OUTCOME" != "success" ]; then
            echo "At least one pipeline failed: AP-HP=$APHP_OUTCOME HCL=$HCL_OUTCOME"
            exit 1
          fi
